
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactează ADR Digital pentru website-uri personalizate, proiecte și colaborări.">
    <title>Contact | ADR Digital</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        /* Buton WhatsApp plutitor */
        .whatsapp-float {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 60px;
            height: 60px;
            background: #25D366;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 22px rgba(0,0,0,0.25);
            z-index: 9999;
            text-decoration: none;
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 28px rgba(37,211,102,0.4);
        }

        .whatsapp-float:focus-visible {
            outline: 3px solid #25D366;
            outline-offset: 4px;
        }

        .whatsapp-float svg {
            width: 32px;
            height: 32px;
        }

        @media (max-width: 600px) {
            .whatsapp-float {
                right: 16px;
                bottom: 16px;
                width: 54px;
                height: 54px;
            }
        }

        /* Mesaje de confirmare formular */
        .form-status {
            margin-top: 14px;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-status.success {
            color: #22c55e;
        }

        .form-status.error {
            color: #ef4444;
        }

        .contact-form button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Câmp anti-spam invizibil */
        .honeypot {
            display: none !important;
        }
    </style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">
        <img src="logo-adr-digital.svg"
             alt="ADR Digital"
             class="logo-img">
    </a>

    <button class="menu-toggle"
            aria-label="Deschide meniul"
            aria-expanded="false">☰</button>

    <nav class="nav">
        <a href="index.html">Acasă</a>
        <a href="despre.html">Despre mine</a>
        <a href="proiecte.html">Proiecte</a>
        <a href="contact.html" class="nav-cta active">
            Contact
        </a>
    </nav>
</header>

<main>
    <section class="section">
        <div class="contact-grid">

            <!-- DATE DE CONTACT -->
            <aside class="content-panel reveal">
                <p class="eyebrow">DATE DE CONTACT</p>
                <h2>Unde mă găsești?</h2>

                <div class="contact-links">

                    <a class="contact-link"
                       href="mailto:zalamoxsyg@yahoo.com">
                        <strong>📩 E-mail</strong>
                        <span>zalamoxsyg@yahoo.com</span>
                    </a>

                    <a class="contact-link"
                       href="https://www.instagram.com/adriancosmin14/"
                       target="_blank"
                       rel="noopener noreferrer">
                        <strong>◎ Instagram</strong>
                        <span>@adriancosmin14</span>
                    </a>

                    <a class="contact-link"
                       href="https://www.facebook.com/"
                       target="_blank"
                       rel="noopener noreferrer">
                        <strong>f Facebook</strong>
                        <span>Adrian Cosmin</span>
                    </a>

                </div>
            </aside>

            <!-- FORMULAR CONTACT -->
            <section class="content-panel reveal">
                <p class="eyebrow">TRIMITE UN MESAJ</p>

                <form class="contact-form"
                      id="contact-form"
                      action="https://api.web3forms.com/submit"
                      method="POST">

                    <!-- CHEIA WEB3FORMS -->
                    <input
                        type="hidden"
                        name="access_key"
                        value="d36c1e47-8254-47f3-b536-171ada7e129c"
                    >

                    <input
                        type="hidden"
                        name="subject"
                        value="Mesaj nou de pe ADR Digital"
                    >

                    <input
                        type="hidden"
                        name="from_name"
                        value="ADR Digital - Formular Contact"
                    >

                    <!-- Protecție anti-spam -->
                    <input
                        type="checkbox"
                        name="botcheck"
                        class="honeypot"
                        tabindex="-1"
                        autocomplete="off"
                    >

                    <label for="name">Numele tău</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Cum te numești?"
                        required
                        minlength="2"
                        maxlength="80"
                    >

                    <label for="email">
                        Adresa de e-mail
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="adresa@yahoo.com"
                        required
                        maxlength="254"
                    >

                    <label for="service">
                        Serviciul dorit
                    </label>
                    <select
                        id="service"
                        name="service"
                        required
                    >
                        <option value="">
                            Alege un serviciu
                        </option>
                        <option value="Website de prezentare">
                            Website de prezentare
                        </option>
                        <option value="Magazin online">
                            Magazin online
                        </option>
                        <option value="Redesign website">
                            Redesign website
                        </option>
                        <option value="Alt proiect">
                            Alt proiect
                        </option>
                    </select>

                    <label for="message">
                        Mesajul tău
                    </label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Cu ce te pot ajuta?"
                        required
                        minlength="10"
                        maxlength="3000"
                    ></textarea>

                    <button
                        type="submit"
                        class="button button-primary"
                        id="submit-btn"
                    >
                        Trimite mesajul ↗
                    </button>

                    <p class="form-status"
                       id="form-status"
                       role="status"
                       aria-live="polite"></p>

                </form>
            </section>

        </div>
    </section>
</main>

<footer class="footer">
    <a href="index.html" class="logo">
        <img src="logo-adr-digital.svg"
             alt="ADR Digital"
             class="logo-img">
    </a>
</footer>

<!-- BUTON WHATSAPP -->
<a
    id="whatsapp-button"
    class="whatsapp-float"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contactează ADR Digital pe WhatsApp"
    title="Scrie-mi pe WhatsApp"
>
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="currentColor"
         aria-hidden="true">
        <path d="M20.52 3.48A11.86 11.86 0 0012.05 0C5.48 0 .13 5.35.12 11.92a11.8 11.8 0 001.58 5.91L0 24l6.33-1.66a11.9 11.9 0 005.71 1.45h.01c6.57 0 11.92-5.35 11.95-11.92a11.85 11.85 0 00-3.48-8.39zM12.05 21.8a9.9 9.9 0 01-5.04-1.38l-.36-.21-3.76.99 1-3.66-.24-.38a9.9 9.9 0 01-1.52-5.24c0-5.47 4.45-9.92 9.93-9.92a9.87 9.87 0 017.01 2.91 9.85 9.85 0 012.9 7.02c-.02 5.47-4.47 9.87-9.92 9.87zm5.44-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/>
    </svg>
</a>

<!-- JAVASCRIPT FORMULAR + WHATSAPP -->
<script>
(function () {
    "use strict";

    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");

    if (form && status && submitBtn) {
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Împiedică trimiterea dublă
            if (submitBtn.disabled) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Se trimite...";
            status.textContent = "";
            status.className = "form-status";

            try {
                const formData = new FormData(form);

                const response = await fetch(
                    "https://api.web3forms.com/submit",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();

                if (response.ok && result.success) {
                    status.textContent =
                        "✓ Mesajul a fost trimis cu succes! Îți voi răspunde cât mai curând.";
                    status.classList.add("success");
                    form.reset();
                } else {
                    throw new Error(
                        result.message || "Eroare la trimitere."
                    );
                }

            } catch (error) {
                status.textContent =
                    "Mesajul nu a putut fi trimis. Te rog încearcă din nou sau contactează-mă pe email.";
                status.classList.add("error");
                console.error("Eroare formular:", error);

            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Trimite mesajul ↗";
            }
        });
    }

    // CONFIGURARE WHATSAPP
    const whatsappNumber = "40724587920";

    const whatsappMessage =
        "Bună! Am văzut site-ul ADR Digital și aș dori să discutăm despre un proiect.";

    const whatsappButton =
        document.getElementById("whatsapp-button");

    if (whatsappButton) {
        whatsappButton.href =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(whatsappMessage);
    }
})();
</script>

</body>
</html>
